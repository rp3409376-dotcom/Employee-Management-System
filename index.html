<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --teal: #007a6b;
    --navy: #111827;
    --bg: #f2f3f5;
    --text: #111827;
    --muted: #4b5563;
    --orange: #ee7203;
    --red: #d40032;
    --blue: #0069a8;
    --green: #007a5a;
    --card: #ffffff;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .layout { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    width: 256px; flex-shrink: 0;
    background: var(--navy);
    color: #fff;
    display: flex; flex-direction: column;
  }
  .brand {
    background: var(--teal);
    height: 64px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
  }
  .nav { padding: 20px 12px; display: flex; flex-direction: column; gap: 8px; }
  .nav a {
    display: flex; align-items: center; gap: 12px;
    height: 44px; padding: 0 16px;
    border-radius: 6px;
    color: #fff; text-decoration: none;
    font-size: 15px; font-weight: 600;
  }
  .nav a i { width: 16px; text-align: center; font-size: 14px; }
  .nav a:hover { background: rgba(255,255,255,.08); }
  .nav a.active { background: var(--teal); }
  .nav a:focus-visible, .logout:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* Main */
  .main { flex: 1; min-width: 0; }
  .topbar {
    height: 64px; background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
  }
  .welcome { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; }
  .badge {
    background: #e6f6fb; color: #0a5c75;
    font-size: 13px; font-weight: 600;
    padding: 4px 12px; border-radius: 999px;
  }
  .logout {
    background: var(--teal); color: #fff; border: 0;
    padding: 10px 18px; border-radius: 6px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .logout:hover { background: #00665a; }

  .content { padding: 44px 44px 48px; max-width: 1100px; }
  .eyebrow { color: var(--teal); font-weight: 700; font-size: 15px; letter-spacing: .02em; }
  h1 { font-size: 34px; font-weight: 700; margin: 4px 0 24px; }
  h2 { font-size: 21px; font-weight: 700; margin: 40px 0 16px; }

  .alert {
    background: #fdf0f0; color: #b00020;
    padding: 14px 12px; border-radius: 4px;
    font-size: 15px; margin-bottom: 20px;
  }
  .alert[hidden] { display: none; }

  .grid { display: grid; gap: 24px; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); gap: 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .icon {
    width: 64px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px;
  }
  .card .info { padding: 18px 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .label { font-size: 15px; font-weight: 600; color: var(--muted); }
  .value { font-size: 28px; font-weight: 700; line-height: 1; }
  .value.name { font-size: 25px; }
  .grid-4 .card .info { padding: 16px; }

  .bg-teal { background: var(--teal); }
  .bg-orange { background: var(--orange); }
  .bg-red { background: var(--red); }
  .bg-blue { background: var(--blue); }
  .bg-green { background: var(--green); }

  @media (max-width: 1000px) {
    .grid-3 { grid-template-columns: 1fr; }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; }
    .nav { flex-direction: row; overflow-x: auto; padding: 12px; }
    .nav a { white-space: nowrap; }
    .content { padding: 24px 16px; }
    .topbar { padding: 0 16px; }
    .welcome { font-size: 15px; }
    .grid-4 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="brand">Employee MS</div>
    <nav class="nav" aria-label="Main navigation">
      <a href="#dashboard" class="active"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a href="#employee"><i class="fa-solid fa-user"></i> Employee</a>
      <a href="#department"><i class="fa-solid fa-building"></i> Department</a>
      <a href="#leave"><i class="fa-solid fa-calendar-days"></i> Leave</a>
      <a href="#salary"><i class="fa-solid fa-money-bill-1-wave"></i> Salary</a>
      <a href="#settings"><i class="fa-solid fa-gears"></i> Settings</a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="welcome">
        <span>Welcome, <span id="userName">Alka Patel</span></span>
        <span class="badge">Employee</span>
      </div>
      <button class="logout" id="logoutBtn">Logout</button>
    </header>

    <main class="content">
      <div class="eyebrow">OVERVIEW</div>
      <h1>Dashboard</h1>

      <div class="alert" id="errorBox" role="alert">Unable to load leave details.</div>

      <section class="grid grid-3">
        <div class="card">
          <div class="icon bg-teal"><i class="fa-solid fa-user"></i></div>
          <div class="info">
            <span class="label">My Account</span>
            <span class="value name" id="accountName">Alka Patel</span>
          </div>
        </div>
        <div class="card">
          <div class="icon bg-orange"><i class="fa-solid fa-building"></i></div>
          <div class="info">
            <span class="label">Total Departments</span>
            <span class="value" id="departments">—</span>
          </div>
        </div>
        <div class="card">
          <div class="icon bg-red"><i class="fa-solid fa-money-bill-1-wave"></i></div>
          <div class="info">
            <span class="label">Monthly Salary</span>
            <span class="value" id="salary">—</span>
          </div>
        </div>
      </section>

      <h2>Leave Details</h2>
      <section class="grid grid-4">
        <div class="card">
          <div class="icon bg-blue"><i class="fa-solid fa-calendar-days"></i></div>
          <div class="info"><span class="label">Leave Applied</span><span class="value" id="leaveApplied">—</span></div>
        </div>
        <div class="card">
          <div class="icon bg-green"><i class="fa-solid fa-calendar-days"></i></div>
          <div class="info"><span class="label">Leave Approved</span><span class="value" id="leaveApproved">—</span></div>
        </div>
        <div class="card">
          <div class="icon bg-orange"><i class="fa-solid fa-calendar-days"></i></div>
          <div class="info"><span class="label">Leave Pending</span><span class="value" id="leavePending">—</span></div>
        </div>
        <div class="card">
          <div class="icon bg-red"><i class="fa-solid fa-calendar-days"></i></div>
          <div class="info"><span class="label">Leave Rejected</span><span class="value" id="leaveRejected">—</span></div>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
  /* ---- Config: yahan apni values / backend URL daalo ---- */
  const API_BASE = "";           // e.g. "https://your-backend.com/api"  (khali = demo mode)
  const USER = { name: "Alka Patel" };

  const $ = (id) => document.getElementById(id);

  function render(data) {
    $("departments").textContent  = data.departments ?? "—";
    $("salary").textContent       = data.salary != null ? "₹" + Number(data.salary).toLocaleString("en-IN") : "—";
    $("leaveApplied").textContent  = data.leave?.applied  ?? "—";
    $("leaveApproved").textContent = data.leave?.approved ?? "—";
    $("leavePending").textContent  = data.leave?.pending  ?? "—";
    $("leaveRejected").textContent = data.leave?.rejected ?? "—";
  }

  async function load() {
    $("userName").textContent = USER.name;
    $("accountName").textContent = USER.name;
    if (!API_BASE) return;               // demo mode: error banner + "—" dikhega
    try {
      const res = await fetch(API_BASE + "/employee/dashboard", {
        headers: { Authorization: "Bearer " + (localStorage.getItem("token") || "") }
      });
      if (!res.ok) throw new Error("Request failed");
      render(await res.json());
      $("errorBox").hidden = true;
    } catch (e) {
      $("errorBox").hidden = false;
    }
  }

  $("logoutBtn").addEventListener("click", () => {
    try { localStorage.removeItem("token"); } catch (e) {}
    location.reload();
  });

  load();
</script>
</body>
</html>
